services:
  aula-nova:
    build:
      context: ./aula-nova-semana9
      dockerfile: Dockerfile
    image: aula-nova:semana09
    container_name: aula-nova-semana09
    ports:
      - "3001:3000"
    restart: "no"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/api/courses').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 5