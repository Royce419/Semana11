name: Semana 9 - Aula Nova

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pruebas-semana-9:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    env:
      BASE_URL: http://127.0.0.1:3001
      COMPOSE_FILE: docker-compose.semana9.yml

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: aula-nova-semana9/package-lock.json

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - name: Instalar k6
        uses: grafana/setup-k6-action@v1

      - name: Instalar dependencias y preparar reportes
        id: instalar
        working-directory: aula-nova-semana9
        run: |
          npm ci
          python -m pip install --upgrade pip
          python -m pip install pytest playwright
          python -m playwright install --with-deps chromium
          mkdir -p reports/servidor reports/pytest reports/seguridad
          mkdir -p reports/performance reports/stress

      - name: Construir y levantar Aula Nova con Docker Compose
        id: docker
        run: docker compose -f "$COMPOSE_FILE" up -d --build

      - name: Esperar a que la aplicación en Docker responda
        id: servidor
        if: ${{ always() && steps.docker.outcome == 'success' }}
        run: |
          for intento in {1..30}; do
            if curl --fail --silent "$BASE_URL/api/courses" > /dev/null; then
              echo "Aula Nova está disponible en Docker."
              exit 0
            fi
            sleep 2
          done
          docker compose -f "$COMPOSE_FILE" logs
          exit 1

      - name: Pruebas unitarias del servidor
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        working-directory: aula-nova-semana9
        run: |
          node --test \
            --test-reporter=junit \
            --test-reporter-destination=reports/servidor/TESTS-servidor.xml \
            backend/server.test.js

      - name: Pruebas funcionales Playwright
        if: ${{ always() && steps.instalar.outcome == 'success' && steps.servidor.outcome == 'success' }}
        working-directory: aula-nova-semana9
        run: |
          python -m pytest tests -v \
            --junitxml=reports/pytest/TESTS-playwright.xml

      - name: Pruebas de rendimiento k6
        if: ${{ always() && steps.instalar.outcome == 'success' && steps.servidor.outcome == 'success' }}
        working-directory: aula-nova-semana9
        run: |
          shopt -s nullglob
          archivos=(prueba-rendimiento/CR-*.js)
          if [ "${#archivos[@]}" -ne 10 ]; then
            echo "Se esperaban 10 escenarios CR; encontrados: ${#archivos[@]}"
            exit 1
          fi

          fallo=0
          for archivo in "${archivos[@]}"; do
            nombre=$(basename "$archivo" .js)
            k6 run --env BASE_URL="$BASE_URL" \
              --summary-export="reports/performance/${nombre}.json" \
              "$archivo" || fallo=1
          done
          exit "$fallo"

      - name: Pruebas de estrés k6
        if: ${{ always() && steps.instalar.outcome == 'success' && steps.servidor.outcome == 'success' }}
        working-directory: aula-nova-semana9
        run: |
          shopt -s nullglob
          archivos=(pruebas-estres/CE-*.js)
          if [ "${#archivos[@]}" -ne 10 ]; then
            echo "Se esperaban 10 escenarios CE; encontrados: ${#archivos[@]}"
            exit 1
          fi

          fallo=0
          for archivo in "${archivos[@]}"; do
            nombre=$(basename "$archivo" .js)
            k6 run --env BASE_URL="$BASE_URL" \
              --summary-export="reports/stress/${nombre}.json" \
              "$archivo" || fallo=1
          done
          exit "$fallo"

      - name: Pruebas de seguridad
        if: ${{ always() && steps.instalar.outcome == 'success' }}
        working-directory: aula-nova-semana9
        run: |
          node --test \
            --test-reporter=junit \
            --test-reporter-destination=reports/seguridad/TESTS-seguridad.xml \
            backend/security.test.js

      - name: Guardar registros y detener Docker Compose
        if: always()
        run: |
          mkdir -p aula-nova-semana9/reports
          docker compose -f "$COMPOSE_FILE" logs --no-color > aula-nova-semana9/reports/docker-compose.log 2>&1 || true
          docker compose -f "$COMPOSE_FILE" down --remove-orphans || true

      - name: Guardar reportes y evidencias
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: semana9-reportes-y-evidencias
          path: |
            aula-nova-semana9/reports/
            aula-nova-semana9/evidencias/
          if-no-files-found: warn
